name: Release

# Pousser un tag `vX.Y.Z` (annoté : son message = notes de version) construit
# Windows + macOS, signe les mises à jour et prépare une release BROUILLON.
# Rien n'est visible des utilisateurs tant que le brouillon n'est pas publié à
# la main : c'est la publication qui déclenche la mise à jour dans les apps.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Créer la release brouillon (notes = message du tag)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          # Brouillon déjà là (workflow relancé) : on le reprend.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [ -z "$id" ]; then
            git tag -l --format='%(contents)' "$TAG" > notes.md
            # L'id vient de la réponse de création : relire la liste juste après
            # ne montre pas toujours le nouveau brouillon (délai de GitHub).
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="Copiteur ${TAG#v}" \
              -F draft=true -F body=@notes.md --jq .id)
          fi
          test -n "$id" || { echo "Release introuvable"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          # Image « macOS 26 + Xcode 27 » : le look des fenêtres dépend du SDK
          # avec lequel l'app est liée (cf. build-macos-test.yml).
          - runner: xcode-27
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Installer les dépendances npm
        working-directory: tauri
        run: npm ci

      - name: Télécharger rclone (sidecar, empreinte vérifiée)
        working-directory: tauri
        run: node scripts/prepare-bins.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Épinglé sur le commit de action-v1.0.0 (dépôt public : pas de tag mobile).
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: tauri
          releaseId: ${{ needs.create-release.outputs.id }}
          args: --target ${{ matrix.target }}
          # latest.json est écrit une seule fois, par le job suivant : deux jobs
          # qui le mettraient à jour en même temps pourraient s'écraser.
          uploadUpdaterJson: false

  updater-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Écrire latest.json (manifeste lu par la mise à jour intégrée)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          win=$(echo "$names" | grep -E -- '-setup\.exe$' | head -1)
          mac=$(echo "$names" | grep -E -- '\.app\.tar\.gz$' | head -1)
          test -n "$win" && test -n "$mac" || { echo "Installeurs manquants : $names"; exit 1; }
          sig() { gh release download "$TAG" -p "$1.sig" -O -; }
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          gh release view "$TAG" --json body --jq .body > notes.md
          jq -n \
            --arg version "${TAG#v}" \
            --rawfile notes notes.md \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg winsig "$(sig "$win")" --arg winurl "$base/$win" \
            --arg macsig "$(sig "$mac")" --arg macurl "$base/$mac" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
               "windows-x86_64": {signature: $winsig, url: $winurl},
               "darwin-aarch64": {signature: $macsig, url: $macurl}}}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber
