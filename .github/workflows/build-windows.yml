name: Build Windows

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Installer les dépendances npm
        run: npm install

      - name: Télécharger rclone (sidecar)
        run: node scripts/prepare-bins.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tauri (x86_64-pc-windows-msvc)
        run: npx tauri build --target x86_64-pc-windows-msvc
        env:
          # Les installeurs embarquent une mise à jour signée (cf. release.yml).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Uploader l'installeur NSIS
        uses: actions/upload-artifact@v4
        with:
          name: Copiteur-windows-x64
          path: tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          # Stockage des artefacts plafonné au mois (500 Mo, tous dépôts privés confondus) :
          # deux jours suffisent pour récupérer le build.
          retention-days: 2
